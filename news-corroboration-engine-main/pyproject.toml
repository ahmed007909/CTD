[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "news-corroboration-engine"
version = "1.0.0"
description = "Bilingual news retrieval, corroboration and live keyword alerts"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1", "feedparser>=6.0,<7", "beautifulsoup4>=4.12,<5",
  "scikit-learn>=1.5,<2", "python-dotenv>=1.0,<2", "yake>=0.4.8,<1"
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6", "spacy>=3.8,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["news_engine*"]

[tool.setuptools.package-data]
news_engine = ["config/*.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

